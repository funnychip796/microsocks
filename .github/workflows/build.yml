name: Build microsocks for MIPSEL 32-bit (RM2100)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Bootlin MIPSEL musl toolchain
      run: |
        # 下载 Bootlin 的 mips32el musl 稳定版工具链
        wget https://toolchains.bootlin.com/downloads/releases/toolchains/mips32el/tarballs/mips32el--musl--stable-2024.02-1.tar.bz2
        
        # 解压
        tar -xjf mips32el--musl--stable-2024.02-1.tar.bz2
        
        # 将 bin 目录添加到系统环境变量中
        echo "$PWD/mips32el--musl--stable-2024.02-1/bin" >> $GITHUB_PATH

    - name: Clone microsocks
      run: |
        git clone https://github.com/funnychip796/microsocks.git

    - name: Build static binary for MIPSEL
      run: |
        # (可选) 打印出 bin 目录下的文件，方便日后排错
        ls -l $GITHUB_WORKSPACE/mips32el--musl--stable-2024.02-1/bin/
        
        cd microsocks
        # 将 mips-linux-gcc 改为 mipsel-linux-gcc
        make CC=mipsel-linux-gcc LDFLAGS="-static -s" CFLAGS="-O2"
        
        # 验证编译出的文件架构是否正确
        file microsocks

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: microsocks-mipsel-rm2100
        path: microsocks/microsocks
