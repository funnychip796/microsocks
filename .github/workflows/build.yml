name: Build microsocks for ARM 32-bit

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Bootlin ARM 32-bit musl toolchain
      run: |
        # 使用 Bootlin 的工具链，速度极快且稳定 (ARMv7 32-bit + Musl)
        # 下载 tar.bz2 压缩包
        wget https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/armv7-eabihf--musl--stable-2021.11-1.tar.bz2
        
        # 解压 (-xjf 用于 .tar.bz2)
        tar -xjf armv7-eabihf--musl--stable-2021.11-1.tar.bz2
        
        # 将 bin 目录添加到系统路径
        # Bootlin 解压后的目录名通常与压缩包名一致
        echo "$PWD/armv7-eabihf--musl--stable-2021.11-1/bin" >> $GITHUB_PATH

    - name: Clone microsocks
      run: |
        git clone https://github.com/funnychip796/microsocks.git
        cd microsocks

    - name: Build static binary for ARM 32-bit
      run: |
        cd microsocks
        # Bootlin 工具链的编译器命令前缀通常是 arm-linux-
        # 这也是 32-bit musl 编译器
        make CC=arm-linux-gcc LDFLAGS="-static -s" CFLAGS="-O2"
        
        # 验证文件格式 (应显示: ELF 32-bit LSB executable, ARM, ..., statically linked)
        file microsocks

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: microsocks-arm-32bit
        path: microsocks/microsocks
